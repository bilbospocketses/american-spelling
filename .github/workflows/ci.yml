# CI for the American spelling gate.
#
# `build-and-test` is the required status check in the main branch ruleset. It is an
# aggregate over the jobs below and passes only when every one of them succeeded:
#   - tests (ubuntu, windows): the suite on real git fixtures, offline;
#   - spelling: the gate run on this repository itself (added lines + commit messages);
#   - allow-public: every repository named in allow.txt is public.
# No job is path-filtered: a required check must report on every pull request.
#
# All actions are pinned to commit SHAs (the repository enforces sha_pinning_required),
# with precise version comments so Dependabot can track them.
#
# No job has a time limit: a slow runner makes a step slow, not wrong. Each step that runs a
# command runs under .github/scripts/stall-watch.sh (stall-watch.ps1 on Windows), which stops it
# only when, for 20 minutes, it has printed no line and shown no other sign of work, prints a hang
# record when it does, and reports the step's duration as a notice. Both scripts are copies of
# bilbospocketses/streamflex's (PR #64, 64defdd), where the rule and its measurements are written up.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Run the suite
        if: runner.os != 'Windows'
        run: bash .github/scripts/stall-watch.sh --name "Run the suite" -- python tests/run_tests.py

      - name: Run the suite
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/stall-watch.ps1 "Run the suite" python tests/run_tests.py

  spelling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the base branch
        run: bash .github/scripts/stall-watch.sh --name "git fetch" -- git fetch --no-tags origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
        env:
          BASE: ${{ github.base_ref || 'main' }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Check American spelling
        run: >-
          bash .github/scripts/stall-watch.sh --name "Check American spelling" --
          python check-american-spelling.py
          --repo .
          --base "origin/${BASE}"
          --repo-slug "${SLUG}"
        env:
          BASE: ${{ github.base_ref || 'main' }}
          SLUG: ${{ github.repository }}

  allow-public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Every repository named in allow.txt is public
        run: bash .github/scripts/stall-watch.sh --name "allow-public" -- python check-allow-public.py

  build-and-test:
    needs: [tests, spelling, allow-public]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: |
          echo "tests=${TESTS} spelling=${SPELLING} allow-public=${ALLOW}"
          [ "${TESTS}" = "success" ] && [ "${SPELLING}" = "success" ] && [ "${ALLOW}" = "success" ]
        env:
          TESTS: ${{ needs.tests.result }}
          SPELLING: ${{ needs.spelling.result }}
          ALLOW: ${{ needs.allow-public.result }}
